name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PLUGINVAL_VERSION: v1.0.4

jobs:
  dsp-tests:
    name: DSP unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build-tests -DVV_BUILD_PLUGIN=OFF -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build-tests --parallel
      - name: Test
        run: ctest --test-dir build-tests --output-on-failure

  plugins:
    name: Plugins (${{ matrix.name }})
    needs: dsp-tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-14
            cmake-args: '-DCMAKE_OSX_ARCHITECTURES="arm64;x86_64" -DCMAKE_OSX_DEPLOYMENT_TARGET=11.0'
          - name: Windows
            os: windows-2022
            cmake-args: ""
          - name: Linux
            os: ubuntu-24.04
            cmake-args: ""
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfreetype-dev libfontconfig1-dev libx11-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libgl-dev xvfb

      - name: Configure
        shell: bash
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DVV_BUILD_TESTS=OFF ${{ matrix.cmake-args }}

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Collect plugins
        shell: bash
        run: |
          mkdir -p dist
          cp -R build/*_artefacts/Release/VST3/*.vst3 dist/
          if [ "$RUNNER_OS" = "macOS" ]; then
            cp -R build/*_artefacts/Release/AU/*.component dist/
            cp -R build/*_artefacts/Release/Standalone/*.app dist/
            # Unsigned downloads must at least be ad-hoc signed to load on Apple Silicon.
            for b in dist/*; do codesign --force --deep --sign - "$b"; done
          elif [ "$RUNNER_OS" = "Windows" ]; then
            cp build/*_artefacts/Release/Standalone/*.exe dist/
          else
            cp "build/VintageVocoderFX_artefacts/Release/Standalone/Vintage Vocoder FX" dist/
          fi
          ls -la dist

      - name: pluginval (VST3)
        shell: bash
        run: |
          case "$RUNNER_OS" in
            macOS)   zip=pluginval_macOS.zip;   bin=./pluginval.app/Contents/MacOS/pluginval; run="" ;;
            Windows) zip=pluginval_Windows.zip; bin=./pluginval.exe;                         run="" ;;
            Linux)   zip=pluginval_Linux.zip;   bin=./pluginval;                             run="xvfb-run -a" ;;
          esac
          curl -sSL -o pluginval.zip "https://github.com/Tracktion/pluginval/releases/download/${PLUGINVAL_VERSION}/${zip}"
          unzip -q -o pluginval.zip
          for p in dist/*.vst3; do
            echo "::group::pluginval $p"
            $run $bin --strictness-level 10 --validate-in-process --timeout-ms 600000 "$p"
            echo "::endgroup::"
          done

      - name: auval (AU)
        if: runner.os == 'macOS'
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R dist/*.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar || true
          auval -a | grep -i srnt || true
          auval -v aumu VVoc Srnt
          auval -v aumf VVfx Srnt

      - name: Package
        shell: bash
        run: |
          # Zip ourselves: upload-artifact drops the executable bit inside bundles.
          name="VintageVocoder-${{ matrix.name }}"
          cp docs/INSTALL.txt dist/
          if [ "$RUNNER_OS" = "macOS" ]; then
            ditto -c -k --sequesterRsrc dist "$name.zip"
          elif [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip "$name.zip" ./dist/*
          else
            (cd dist && zip -qry "../$name.zip" .)
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: VintageVocoder-${{ matrix.name }}
          path: VintageVocoder-${{ matrix.name }}.zip

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: plugins
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
